<!-- Page de passage pour les liens des réseaux sociaux (29/10/2026) :
     compte la visite dans Umami (avec utm_source), puis envoie vers l'App Store.
     Android : boutons de téléchargement de la landing page (l'app n'est pas encore sur Google Play). -->
<script defer src="https://cloud.umami.is/script.js" data-website-id="57490624-2c99-49d0-a3ac-b786a88d68ae"></script>
<script>
(function () {
  var STORE = 'https://apps.apple.com/fr/app/feelgood-conduite/id6808385275';
  var dest = /Android/i.test(navigator.userAgent) ? 'https://feelgoodconduite.fr/#telecharger' : STORE;
  var done = false;
  function go() { if (!done) { done = true; location.replace(dest); } }
  var source = new URLSearchParams(location.search).get('utm_source') || 'direct';
  function waitUmami(n) {
    if (window.umami && window.umami.track) {
      try { window.umami.track('clic-app-store', { source: source, appareil: /Android/i.test(navigator.userAgent) ? 'android' : 'autre' }); } catch (e) {}
      setTimeout(go, 700);
    } else if (n > 0) setTimeout(function () { waitUmami(n - 1); }, 100);
    else go();
  }
  window.addEventListener('load', function () { waitUmami(20); });
  setTimeout(go, 3000);
})();
</script>

</body>
